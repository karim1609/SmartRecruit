services:

  mongodb:
    image: mongo:8
    container_name: smartrecruit-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - smartrecruit-network

  redis:
    image: redis:7-alpine
    container_name: smartrecruit-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - smartrecruit-network

  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: smartrecruit-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - smartrecruit-network

  neo4j:
    image: neo4j:5-community
    container_name: smartrecruit-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    networks:
      - smartrecruit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartrecruit-backend
    restart: unless-stopped
    ports:
      - "8000:8000"

    environment:
      APP_NAME: SmartRecruit API
      APP_VERSION: 1.0.0
      DEBUG: "true"

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/smart_recruit?authSource=admin
      MONGODB_DATABASE: smart_recruit

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: candidates
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      CORS_ORIGINS: '["http://localhost:3000"]'

    depends_on:
      - mongodb
      - redis
      - qdrant
      - neo4j

    networks:
      - smartrecruit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartrecruit-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartrecruit-network

volumes:
  mongo-data:
  redis-data:
  qdrant-data:
  neo4j-data:

networks:
  smartrecruit-network:
    driver: bridge