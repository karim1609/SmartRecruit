<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartRecruit Notification{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            background-color: #f4f6f9;
            padding: 40px 0;
        }
        .container {
            max-width: 580px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e5e7eb;
        }
        .header {
            background: linear-gradient(135deg, #0b192c 0%, #1e3e62 100%);
            padding: 32px 36px;
            text-align: center;
        }
        .logo-img {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: inline-block;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }
        .logo-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
        }
        .logo-subtitle {
            color: #93c5fd;
            font-size: 13px;
            margin-top: 4px;
            font-weight: 500;
        }
        .content {
            padding: 36px;
        }
        .footer {
            background-color: #f9fafb;
            padding: 24px 36px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #6b7280;
        }
        .footer a {
            color: #2563eb;
            text-decoration: none;
        }
        @media only screen and (max-width: 600px) {
            .container {
                width: 92% !important;
                margin: 0 auto !important;
            }
            .content, .header, .footer {
                padding: 24px !important;
            }
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header" style="background-color: #0b192c; background: linear-gradient(135deg, #0b192c 0%, #1e3e62 100%); padding: 32px 36px; text-align: center;">
                <img src="cid:smartrecruit_logo" alt="SmartRecruit Logo" width="56" height="56" class="logo-img" style="width: 56px; height: 56px; border-radius: 14px; display: inline-block; margin-bottom: 12px; border: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.25);" />
                <div class="logo-text" style="color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin: 0; line-height: 1.2;">SmartRecruit</div>
                <div class="logo-subtitle" style="color: #93c5fd; font-size: 13px; margin-top: 6px; font-weight: 500; letter-spacing: 0.2px;">Intelligent Talent Acquisition Platform</div>
            </div>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
            <div class="footer">
                <p>&copy; {{ current_year }} SmartRecruit Platform. All rights reserved.</p>
                <p>This is an automated notification. Please do not reply directly to this email.</p>
            </div>
        </div>
    </div>
</body>
</html>
